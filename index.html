
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZELPX | Contractor Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#071426,#102d50,#071426);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #172b46;
}

.wrapper {
  width: 100%;
  max-width: 440px;
}

.brand {
  text-align: center;
  color: white;
  margin-bottom: 28px;
}

.brand h1 {
  font-size: 38px;
  letter-spacing: 7px;
  margin: 0;
  font-weight: 800;
}

.brand p {
  color: #9bb9dc;
  letter-spacing: 3px;
  font-size: 11px;
}

.panel {
  background: white;
  border-radius: 18px;
  padding: 35px 30px;
  box-shadow: 0 25px 70px #0006;
}

h2 {
  margin: 0 0 8px;
  font-size: 25px;
}

.subtitle {
  color: #718096;
  font-size: 14px;
  margin-bottom: 26px;
}

.tabs {
  display: flex;
  background: #edf2f8;
  padding: 5px;
  border-radius: 9px;
  margin-bottom: 23px;
}

.tabs button {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 12px;
  border-radius: 7px;
  color: #607087;
  font-weight: bold;
  cursor: pointer;
}

.tabs button.active {
  background: white;
  color: #1769e0;
  box-shadow: 0 2px 8px #0001;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #dce3ed;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #2476e8;
  box-shadow: 0 0 0 3px #2476e81c;
}

.main-btn {
  width: 100%;
  margin-top: 23px;
  padding: 15px;
  background: #1769e0;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.main-btn:hover { background: #0e56bd; }
.main-btn:disabled { opacity: .6; cursor: wait; }

.message {
  margin-top: 17px;
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
  color: #1769e0;
  overflow-wrap: anywhere;
}

.footer {
  text-align: center;
  color: #91a8c4;
  font-size: 12px;
  margin-top: 25px;
}

.hidden { display: none; }

@media(max-width:480px) {
  .panel { padding: 28px 22px; }
}
</style>
</head>

<body>
<div class="wrapper">

  <div class="brand">
    <h1>ZELPX</h1>
    <p>CONTRACTOR PORTAL</p>
  </div>

  <div class="panel">
    <div id="authPanel">
      <h2 id="heading">Welcome Back</h2>
      <div class="subtitle" id="subtitle">
        Sign in to your contractor account.
      </div>

      <div class="tabs">
        <button id="loginTab" class="active" type="button">
          Sign In
        </button>
        <button id="registerTab" type="button">
          Create Account
        </button>
      </div>

      <form id="authForm">
        <div id="nameField" class="hidden">
          <label for="fullname">Full Name</label>
          <input id="fullname" type="text"
            placeholder="Your full name">
        </div>

        <label for="email">Email Address</label>
        <input id="email" type="email"
          placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input id="password" type="password"
          placeholder="Enter your password"
          minlength="6" required>

        <button class="main-btn" id="submitBtn" type="submit">
          Sign In
        </button>
      </form>

      <div class="message" id="message" role="status"></div>
    </div>

    <div id="signedIn" class="hidden">
      <h2>You are connected!</h2>
      <p class="subtitle">
        Your ZELPX account is active.
      </p>
      <p id="accountEmail"></p>
      <button class="main-btn" id="logoutBtn">
        Sign Out
      </button>
    </div>
  </div>

  <div class="footer">
    ZELPX.COM · Contractor Lead Marketplace
  </div>
</div>

<script>
// INSERT YOUR SUPABASE VALUES BELOW
const SUPABASE_URL = "https://zsrnjkndgbchfxibxiyd.supabase.co";
const SUPABASE_KEY = "sb_publishable_prE7ENnFQaUGIq3h8U_uAQ_V9SjuBnb";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);
let mode = "login";

function setMode(newMode) {
  mode = newMode;
  const registering = mode === "register";

  $("heading").textContent =
    registering ? "Create Your Account" : "Welcome Back";

  $("subtitle").textContent =
    registering
      ? "Join the ZELPX contractor network."
      : "Sign in to your contractor account.";

  $("submitBtn").textContent =
    registering ? "Create Account" : "Sign In";

  $("loginTab").classList.toggle("active", !registering);
  $("registerTab").classList.toggle("active", registering);
  $("nameField").classList.toggle("hidden", !registering);
  $("fullname").required = registering;
  $("message").textContent = "";
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("registerTab").addEventListener("click", () => setMode("register"));

function showAccount(user) {
  $("authPanel").classList.add("hidden");
  $("signedIn").classList.remove("hidden");
  $("accountEmail").textContent = user.email || "";
}

function showLogin() {
  $("signedIn").classList.add("hidden");
  $("authPanel").classList.remove("hidden");
}

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;
  const fullname = $("fullname").value.trim();

  $("submitBtn").disabled = true;
  $("message").textContent = "Please wait...";

  try {
    if (mode === "register") {
      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullname }
        }
      });

      if (error) throw error;

      if (data.session) {
        showAccount(data.user);
        $("message").textContent = "";
      } else {
        $("message").textContent =
          "Registration successful! Please check your email to confirm your account.";
      }
    } else {
      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      showAccount(data.user);
      $("message").textContent = "";
    }
  } catch (error) {
    $("message").textContent = error.message;
  } finally {
    $("submitBtn").disabled = false;
  }
});

$("logoutBtn").addEventListener("click", async () => {
  const { error } = await db.auth.signOut();
  if (error) {
    $("message").textContent = error.message;
    return;
  }
  showLogin();
});

async function checkSession() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    $("message").textContent = error.message;
    return;
  }

  if (data.session) showAccount(data.session.user);
}

checkSession();

db.auth.onAuthStateChange((event, session) => {
  if (session) showAccount(session.user);
  else showLogin();
});
</script>
</body>
</html>
