
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZELPX Contractor Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #17202a;
    }
    header {
      background: #102b25;
      color: white;
      padding: 22px;
      text-align: center;
    }
    header h1 { margin: 0; letter-spacing: 2px; }
    main {
      max-width: 460px;
      margin: 45px auto;
      padding: 25px;
    }
    .panel {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 5px 25px #00000012;
    }
    h2 { margin-top: 0; }
    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #ccd3d8;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #087b58;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: #263b35; }
    button:disabled { opacity: .5; }
    .switch {
      text-align: center;
      margin-top: 20px;
      color: #087b58;
      cursor: pointer;
    }
    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      overflow-wrap: anywhere;
    }
    #dashboard { display: none; }
    .muted { color: #68747c; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>ZELPX</h1>
    <p>Contractor Portal</p>
  </header>

  <main>
    <section class="panel" id="authPanel">
      <h2 id="formTitle">Contractor Login</h2>
      <p class="muted" id="formDescription">
        Sign in to access your ZELPX contractor account.
      </p>

      <form id="authForm">
        <input id="email" type="email" placeholder="Email address" required>
        <input id="password" type="password"
          placeholder="Password (minimum 8 characters)"
          minlength="8" required>
        <button id="submitButton" type="submit">Sign In</button>
      </form>

      <div class="switch" id="switchMode">
        New contractor? Create an account
      </div>
      <div id="message"></div>
    </section>

    <section class="panel" id="dashboard">
      <h2>Welcome to ZELPX!</h2>
      <p>Your account is connected.</p>
      <p class="muted" id="userEmail"></p>
      <p class="muted">
        Your contractor dashboard is being set up.
      </p>
      <button class="secondary" id="logoutButton">Sign Out</button>
    </section>
  </main>

  <script>
    // STEP 1: Add your Supabase project URL and public key here.
    const SUPABASE_URL = "https://uxqykfrzowprkemokhfo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_O0a95ixw73AGpIT_ZlNZrA_Mh7GAX6X";

    const authPanel = document.getElementById("authPanel");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");
    const authForm = document.getElementById("authForm");
    const submitButton = document.getElementById("submitButton");

    let isRegistering = false;
    let supabaseClient = null;

    function showMessage(text, success = false) {
      message.style.display = "block";
      message.style.background = success ? "#e4f7ed" : "#fdeaea";
      message.style.color = success ? "#17643d" : "#a12626";
      message.textContent = text;
    }

    function setMode(registering) {
      isRegistering = registering;
      document.getElementById("formTitle").textContent =
        registering ? "Create Contractor Account" : "Contractor Login";
      document.getElementById("formDescription").textContent =
        registering
          ? "Register to join the ZELPX contractor network."
          : "Sign in to access your ZELPX contractor account.";
      submitButton.textContent = registering ? "Create Account" : "Sign In";
      document.getElementById("switchMode").textContent =
        registering
          ? "Already registered? Sign in"
          : "New contractor? Create an account";
      message.style.display = "none";
    }

    function showDashboard(user) {
      authPanel.style.display = "none";
      dashboard.style.display = "block";
      document.getElementById("userEmail").textContent =
        "Signed in as: " + user.email;
    }

    async function startApp() {
      if (
        SUPABASE_URL.includes("YOUR_") ||
        SUPABASE_ANON_KEY.includes("YOUR_")
      ) {
        showMessage(
          "Setup needed: add your Supabase project URL and public key in the code."
        );
        return;
      }

      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

      const { data, error } = await supabaseClient.auth.getSession();

      if (error) {
        showMessage(error.message);
        return;
      }

      if (data.session) {
        showDashboard(data.session.user);
      }
    }

    authForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!supabaseClient) {
        showMessage("Supabase is not configured yet.");
        return;
      }

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitButton.disabled = true;
      submitButton.textContent = "Please wait...";
      message.style.display = "none";

      try {
        if (isRegistering) {
          const { data, error } =
            await supabaseClient.auth.signUp({ email, password });

          if (error) throw error;

          if (data.session) {
            showDashboard(data.session.user);
          } else {
            showMessage(
              "Registration received. Check your email and confirm your account before signing in.",
              true
            );
          }
        } else {
          const { data, error } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });

          if (error) throw error;
          showDashboard(data.user);
        }
      } catch (error) {
        showMessage(error.message || "Something went wrong.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent =
          isRegistering ? "Create Account" : "Sign In";
      }
    });

    document.getElementById("switchMode").addEventListener("click", function() {
      setMode(!isRegistering);
    });

    document.getElementById("logoutButton").addEventListener("click", async function() {
      const { error } = await supabaseClient.auth.signOut();

      if (error) {
        showMessage(error.message);
        return;
      }

      dashboard.style.display = "none";
      authPanel.style.display = "block";
      setMode(false);
    });

    startApp();
  </script>
</body>
</html>
