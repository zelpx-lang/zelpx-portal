
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10243a">
  <title>ZELPX — Кабинет заказчика</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #f3f6fa; color: #172b43;
      font: 16px/1.5 Arial, sans-serif;
    }
    .card {
      width: 100%; max-width: 460px; padding: 28px;
      background: white; border: 1px solid #dce4ed;
      border-radius: 15px; box-shadow: 0 5px 22px #10243a12;
    }
    h1 { color: #10243a; margin: 0; font-size: 27px; }
    h2 { margin: 22px 0 8px; }
    p { color: #64748b; }
    label { display: block; margin: 14px 0 5px; font-weight: bold; }
    input {
      width: 100%; min-height: 46px; padding: 11px 12px;
      border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%; min-height: 46px; margin-top: 14px;
      padding: 12px; border: 0; border-radius: 8px;
      background: #1769aa; color: white;
      font-size: 15px; font-weight: bold; cursor: pointer;
    }
    button.secondary { background: #e8eef5; color: #10243a; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { white-space: pre-wrap; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
    .notice {
      margin-top: 18px; padding: 12px;
      background: #f3f6fa; border-radius: 8px;
      color: #52647a; font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>ZELPX</h1>
    <p>Кабинет заказчика — заявки на ремонт и услуги.</p>

    <section id="authView">
      <h2 id="formTitle">Регистрация заказчика</h2>

      <div id="nameField">
        <label for="fullName">Ваше имя</label>
        <input id="fullName" type="text" autocomplete="name"
               placeholder="Имя и фамилия">
      </div>

      <label for="phone">Телефон</label>
      <input id="phone" type="tel" autocomplete="tel"
             placeholder="Ваш номер телефона">

      <label for="email">Электронная почта</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="name@example.com">

      <label for="password">Пароль</label>
      <input id="password" type="password" autocomplete="new-password"
             placeholder="Не менее 8 символов">

      <button id="submitButton" type="button">Зарегистрироваться</button>
      <button id="switchButton" class="secondary" type="button">
        Уже есть аккаунт? Войти
      </button>
    </section>

    <section id="accountView" class="hidden">
      <h2>Ваш кабинет</h2>
      <p id="welcomeText"></p>
      <p id="emailText"></p>
      <div class="notice">
        Ваш аккаунт создан. Следующим этапом подключим создание заявок,
        просмотр их статуса и переписку с подрядчиком.
      </div>
      <button id="logoutButton" type="button">Выйти из аккаунта</button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://zsrnjkndgbchfxibxiyd.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_prE7ENnFQaUGIq3h8U_uAQ_V9SjuBnb";

      const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      const $ = id => document.getElementById(id);

      let isLogin = false;

      function showMessage(text) {
        $("message").textContent = text;
      }

      function showAccount(user) {
        $("authView").classList.add("hidden");
        $("accountView").classList.remove("hidden");

        const name = user.user_metadata?.full_name || "заказчик";
        $("welcomeText").textContent = "Здравствуйте, " + name + "!";
        $("emailText").textContent = user.email || "";
        showMessage("");
      }

      function showAuth() {
        $("accountView").classList.add("hidden");
        $("authView").classList.remove("hidden");
      }

      $("switchButton").addEventListener("click", () => {
        isLogin = !isLogin;

        $("formTitle").textContent = isLogin
          ? "Вход заказчика"
          : "Регистрация заказчика";

        $("submitButton").textContent = isLogin
          ? "Войти"
          : "Зарегистрироваться";

        $("switchButton").textContent = isLogin
          ? "Нет аккаунта? Зарегистрироваться"
          : "Уже есть аккаунт? Войти";

        $("nameField").classList.toggle("hidden", isLogin);
        $("phone").parentElement?.classList.toggle("hidden", isLogin);
        $("password").autocomplete =
          isLogin ? "current-password" : "new-password";

        showMessage("");
      });

      $("submitButton").addEventListener("click", async () => {
        const email = $("email").value.trim();
        const password = $("password").value;
        const fullName = $("fullName").value.trim();
        const phone = $("phone").value.trim();

        if (!email || !password) {
          showMessage("Введите электронную почту и пароль.");
          return;
        }

        if (password.length < 8) {
          showMessage("Пароль должен содержать не менее 8 символов.");
          return;
        }

        if (!isLogin && !fullName) {
          showMessage("Введите ваше имя.");
          return;
        }

        const button = $("submitButton");
        button.disabled = true;
        button.textContent = "Пожалуйста, подождите…";

        try {
          let result;

          if (isLogin) {
            result = await db.auth.signInWithPassword({
              email,
              password
            });
          } else {
            result = await db.auth.signUp({
              email,
              password,
              options: {
                data: {
                  full_name: fullName,
                  phone: phone,
                  role: "customer"
                }
              }
            });
          }

          if (result.error) throw result.error;

          if (!isLogin && !result.data.session) {
            showMessage(
              "Регистрация создана. Проверьте электронную почту " +
              "и подтвердите адрес. Затем войдите в кабинет."
            );
          } else if (result.data.user) {
            showAccount(result.data.user);
          }

        } catch (error) {
          showMessage("Ошибка: " + error.message);
        } finally {
          button.disabled = false;
          button.textContent = isLogin
            ? "Войти"
            : "Зарегистрироваться";
        }
      });

      $("logoutButton").addEventListener("click", async () => {
        const { error } = await db.auth.signOut();

        if (error) {
          showMessage("Не удалось выйти: " + error.message);
          return;
        }

        showAuth();
        showMessage("Вы вышли из аккаунта.");
      });

      async function start() {
        try {
          const { data, error } = await db.auth.getSession();
          if (error) throw error;

          if (data.session?.user) {
            showAccount(data.session.user);
          }

          db.auth.onAuthStateChange((_event, session) => {
            if (session?.user) {
              showAccount(session.user);
            } else {
              showAuth();
            }
          });
        } catch (error) {
          showMessage("Ошибка подключения: " + error.message);
        }
      }

      start();
    })();
  </script>
</body>
</html>
