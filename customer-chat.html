
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZELPX — Customer Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #f3f5f8;
      color: #182230;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 680px;
      margin: 30px auto;
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,.07);
    }
    .brand {
      color: #1769aa;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .muted { color: #667085; font-size: 14px; }
    #messages {
      margin-top: 22px;
      height: 380px;
      overflow-y: auto;
      border: 1px solid #e3e7ed;
      border-radius: 10px;
      padding: 14px;
      background: #fafbfc;
    }
    .message {
      max-width: 85%;
      padding: 11px 13px;
      border-radius: 12px;
      margin: 10px 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .customer {
      margin-left: auto;
      background: #dceeff;
    }
    .contractor {
      margin-right: auto;
      background: #e9edf2;
    }
    .sender {
      font-size: 11px;
      font-weight: bold;
      color: #526174;
      margin-bottom: 5px;
    }
    .time {
      font-size: 10px;
      color: #667085;
      margin-top: 6px;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #ccd3dc;
      border-radius: 9px;
      font: inherit;
      resize: vertical;
    }
    button {
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 14px; color: #667085; }
    .error { color: #b42318 !important; }
  </style>
</head>
<body>
  <main class="container">
    <div class="brand">ZELPX</div>
    <h1>Messages with your contractor</h1>
    <p class="muted">
      This is your private conversation about your home repair request.
      You do not need to create an account.
    </p>

    <div id="messages" aria-live="polite">
      Loading messages...
    </div>

    <form id="messageForm">
      <textarea id="messageInput" maxlength="5000"
        placeholder="Write your message..." required></textarea>
      <button id="sendButton" type="submit">Send message</button>
    </form>

    <div id="status" role="status"></div>
  </main>

  <script>
    const FUNCTION_URL =
      "https://zsrnjkndgbchfxibxiyd.supabase.co/functions/v1/customer-chat";

    const SUPABASE_KEY =
      "sb_publishable_prE7ENnFQaUGIq3h8U_uAQ_V9SjuBnb";

    const token = new URLSearchParams(window.location.search).get("token");

    const messagesBox = document.getElementById("messages");
    const statusBox = document.getElementById("status");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const form = document.getElementById("messageForm");

    let loading = false;

    function showStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.className = isError ? "error" : "";
    }

    async function api(action, message) {
      const response = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify({
          token,
          action,
          message
        })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || "Request failed");
      }

      return result;
    }

    function displayMessages(messages) {
      messagesBox.replaceChildren();

      if (!messages || messages.length === 0) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = "No messages yet. You can send the first message below.";
        messagesBox.appendChild(empty);
        return;
      }

      messages.forEach((item) => {
        const bubble = document.createElement("div");
        bubble.className = "message " +
          (item.sender_type === "customer" ? "customer" : "contractor");

        const sender = document.createElement("div");
        sender.className = "sender";
        sender.textContent =
          item.sender_type === "customer" ? "YOU" : "CONTRACTOR";

        const text = document.createElement("div");
        text.textContent = item.message;

        const time = document.createElement("div");
        time.className = "time";
        time.textContent = new Date(item.created_at).toLocaleString();

        bubble.append(sender, text, time);
        messagesBox.appendChild(bubble);
      });

      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    async function loadMessages() {
      if (loading || !token) return;

      loading = true;

      try {
        const result = await api("read");
        displayMessages(result.messages);
      } catch (error) {
        showStatus(error.message, true);
      } finally {
        loading = false;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message || !token) return;

      sendButton.disabled = true;
      showStatus("Sending...");

      try {
        await api("send", message);
        input.value = "";
        showStatus("Message sent.");
        await loadMessages();
      } catch (error) {
        showStatus(error.message, true);
      } finally {
        sendButton.disabled = false;
      }
    });

    if (!token) {
      messagesBox.textContent = "The chat link is missing its access token.";
      input.disabled = true;
      sendButton.disabled = true;
      showStatus("Please open the complete link from your ZELPX email.", true);
    } else {
      loadMessages();
      setInterval(loadMessages, 10000);
    }
  </script>
</body>
</html>
