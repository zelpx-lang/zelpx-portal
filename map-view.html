<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717"><title>ZELPX Leads</title>
<style>
:root{--orange:#ff6a2b;--ink:#171717;--paper:#f6f2ec;--line:#e8dfd3;--muted:#777168}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial}
header{height:64px;background:var(--ink);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}
.brand{font-weight:900;letter-spacing:.22em}.brand i{color:var(--orange);font-style:normal}
header a,header button{color:white;text-decoration:none;border:1px solid #555;background:#292929;border-radius:999px;padding:9px 14px;font-weight:700}
main{max-width:1500px;margin:auto;padding:14px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{min-height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 12px;color:var(--ink);font:inherit}
.toolbar input{flex:1;min-width:170px}.toolbar select{min-width:160px}
.action{border:0;border-radius:999px;background:var(--orange);color:white;font-weight:800;padding:11px 18px;min-height:42px}
.status{color:var(--muted);font-size:13px;margin-left:auto}
.side{background:#fffdfa;border:1px solid var(--line);border-radius:18px;overflow:visible;padding:12px}
.side h2{font-size:20px;margin:2px 0 4px}.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0 8px}.pager button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;font-weight:800}.pager button:disabled{opacity:.4}.page-info{font-size:13px;color:var(--muted);font-weight:700}
.lead{border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0;cursor:pointer}
.lead.active{border-color:var(--orange);box-shadow:0 0 0 2px #ff6a2b22}
.lead strong{font-size:15px}.price{float:right;color:#c24e1e;font-weight:900}.meta{font-size:12px;color:var(--muted);margin-top:4px}
.empty{padding:22px 10px;text-align:center;color:var(--muted)}
@media(max-width:800px){main{padding:9px}.status{width:100%;margin-left:0}.toolbar{gap:7px}.toolbar input{flex-basis:100%}.toolbar select{flex:1;min-width:0}.pager button{padding:9px 12px}}
</style>
</head>
<body>
<header><div class="brand">ZELPX<i>.</i> <span style="font-size:11px;letter-spacing:.08em;color:#bbb">LEAD DIRECTORY</span></div><a href="/contractor">← Contractor portal</a></header>
<main>
<div class="toolbar">
<input id="search" type="search" placeholder="Search service, ZIP or details…">
<select id="category"><option value="">All services</option></select>
<select id="status"><option value="available">Available leads</option><option value="all">All visible leads</option></select>
<button class="action" id="refresh">Refresh leads</button>
<span class="status" id="statusText">Checking your account…</span>
</div>
<section class="side"><h2>Available leads</h2><p class="hint">Browse service requests. Each page shows up to 50 leads.</p><div id="leadList"><div class="empty">Loading leads…</div></div><div class="pager" id="pager"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{"use strict";
const URL="https://zsrnjkndgbchfxibxiyd.supabase.co",KEY="sb_publishable_prE7ENnFQaUGIq3h8U_uAQ_V9SjuBnb";
const $=id=>document.getElementById(id);let db,map,markers=[],markerGroup=null,leads=[],zipCache=new Map(),timer=null;
const money=c=>"$"+(Number(c||0)/100).toFixed(0);
function setStatus(t){$("statusText").textContent=t}
function visible(){const q=$("search").value.trim().toLowerCase(),cat=$("category").value,st=$("status").value;return leads.filter(x=>(st==="all"||x.status==="available")&&(!cat||x.service_category===cat)&&(!q||[x.service_category,x.zip_code,x.description,x.urgency].join(" ").toLowerCase().includes(q)))}
function render(){
 const rows=visible(),totalPages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));currentPage=Math.min(currentPage,totalPages);
 const startIndex=(currentPage-1)*PAGE_SIZE,pageRows=rows.slice(startIndex,startIndex+PAGE_SIZE);$("leadList").replaceChildren();
 if(!rows.length){$("leadList").innerHTML='<div class="empty">No matching leads right now.</div>';setStatus("0 leads found");$("pager").replaceChildren();return}
 for(const lead of pageRows){
  const card=document.createElement("article");card.className="lead";
  const title=document.createElement("strong");title.textContent=lead.service_category||"Home service";
  const price=document.createElement("span");price.className="price";price.textContent=money(lead.price_cents);
  const meta=document.createElement("div");meta.className="meta";meta.textContent=(lead.zip_code||"ZIP unavailable")+" · "+(lead.urgency||"Standard");
  const desc=document.createElement("div");desc.className="meta";desc.textContent=(lead.description||"Service request").slice(0,180);
  const buy=document.createElement("a");buy.href="/contractor?lead="+encodeURIComponent(String(lead.id));buy.textContent="View & Buy This Lead";buy.style.cssText="display:inline-flex;margin-top:12px;padding:9px 16px;border-radius:999px;background:#ff6a2b;color:#fff;text-decoration:none;font-weight:800";
  card.append(title,price,meta,desc,buy);$("leadList").append(card);
 }
 $("pager").replaceChildren();
 const prev=document.createElement("button");prev.textContent="← Previous";prev.disabled=currentPage===1;prev.addEventListener("click",()=>{currentPage--;render();window.scrollTo({top:0,behavior:"smooth"})});
 const info=document.createElement("span");info.className="page-info";info.textContent="Page "+currentPage+" of "+totalPages+" · "+rows.length+" leads";
 const next=document.createElement("button");next.textContent="Next →";next.disabled=currentPage>=totalPages;next.addEventListener("click",()=>{currentPage++;render();window.scrollTo({top:0,behavior:"smooth"})});
 $("pager").append(prev,info,next);setStatus(rows.length+" leads · showing "+(startIndex+1)+"–"+Math.min(startIndex+PAGE_SIZE,rows.length));
}
async function load(){
 $("refresh").disabled=true;setStatus("Updating…");
 try{
  const {data:{session},error:se}=await db.auth.getSession();if(se)throw se;
  if(!session){
    setStatus("Please sign in first");
    $("leadList").innerHTML='<div class="empty">Your contractor session is not active in this tab. <a href="/contractor" style="color:#c24e1e;font-weight:800">Sign in to Contractor Portal</a>, then open Map View again.</div>';
    return;
  }
  let {data,error}=await db.from("leads").select("id,service_category,service_state,zip_code,description,urgency,price_cents,status,created_at,lead_type,package_services,service_latitude,service_longitude").order("created_at",{ascending:false}).limit(1000);
  // RLS can return an empty array (not an error) when a contractor has no category access yet.
  // In that case use the safe public preview view, which exposes ZIP/service/price only.
  if(error || !data?.length){
    const preview=await db.from("public_available_leads")
      .select("id,service_category,zip_code,service_state,price_cents,created_at,urgency")
      .order("created_at",{ascending:false}).limit(1000);
    if(preview.error)throw error||preview.error;
    data=(preview.data||[]).map(x=>({...x,description:"",status:"available",previewOnly:true}));
  }
  leads=data||[];
  const cats=[...new Set(leads.map(x=>x.service_category).filter(Boolean))].sort();const old=$("category").value;$("category").replaceChildren(new Option("All services",""));cats.forEach(c=>$("category").add(new Option(c,c)));$("category").value=cats.includes(old)?old:"";
  currentPage=1;render();if(!timer)timer=setInterval(load,45000);
 }catch(e){setStatus("Could not load leads: "+(e.message||""));$("leadList").innerHTML='<div class="empty">Please sign in to your contractor account and try again.</div>'}
 finally{$("refresh").disabled=false}
}
function start(){if(!window.supabase){setStatus("Lead library did not load. Refresh this page.");return}db=window.supabase.createClient(URL,KEY);$("refresh").addEventListener("click",load);$("search").addEventListener("input",()=>{currentPage=1;render()});$("category").addEventListener("change",()=>{currentPage=1;render()});$("status").addEventListener("change",()=>{currentPage=1;render()});load()}
start();
})();
</script>
</body></html>
