<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZELPX | Customer Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px 16px;
      min-height: 100vh;
      background: #f4f6f9;
      font-family: Arial, sans-serif;
      color: #202938;
    }

    .container {
      max-width: 440px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #1769aa;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd2da;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: 0;
      border-radius: 7px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .switch a {
      color: #1769aa;
      cursor: pointer;
      font-weight: bold;
    }

    .message {
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      overflow-wrap: anywhere;
    }

    .error {
      display: block;
      color: #a32121;
      background: #fff0f0;
    }

    .success {
      display: block;
      color: #176b36;
      background: #eaf8ef;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">ZELPX</div>

    <section id="authView">
      <h1 id="formTitle">Create Customer Account</h1>
      <p class="subtitle" id="formSubtitle">
        Create an account to request services and communicate with contractors.
      </p>

      <form id="authForm">
        <div id="nameField">
          <label for="fullName">Full Name</label>
          <input id="fullName" type="text" autocomplete="name">
        </div>

        <div id="phoneField">
          <label for="phone">Phone Number</label>
          <input id="phone" type="tel" autocomplete="tel">
        </div>

        <label for="email">Email Address</label>
        <input id="email" type="email" autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password"
               autocomplete="current-password" required minlength="6">

        <button id="submitButton" type="submit">Create Account</button>
      </form>

      <div id="message" class="message" role="status"></div>

      <div class="switch">
        <span id="switchText">Already have an account?</span>
        <a id="switchLink" href="#">Log In</a>
      </div>
    </section>

    <section id="dashboardView" class="hidden">
      <h1>Customer Dashboard</h1>
      <p class="subtitle">Welcome to your ZELPX customer account.</p>
      <p id="accountEmail"></p>
      <p>Your customer account is ready.</p>
      <p>Service request and messaging features will be available here.</p>
      <button id="logoutButton" type="button">Log Out</button>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://zsrnjkndgbchfxibxiyd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_prE7ENnFQaUGIq3h8U_uAQ_V9SjuBnb";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const $ = (id) => document.getElementById(id);

    let isLogin = false;

    function showMessage(text, type) {
      const message = $("message");
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      $("message").textContent = "";
      $("message").className = "message";
    }

    function setMode(loginMode) {
      isLogin = loginMode;
      clearMessage();

      $("formTitle").textContent = isLogin
        ? "Customer Log In"
        : "Create Customer Account";

      $("formSubtitle").textContent = isLogin
        ? "Log in to access your customer account."
        : "Create an account to request services and communicate with contractors.";

      $("nameField").classList.toggle("hidden", isLogin);
      $("phoneField").classList.toggle("hidden", isLogin);

      $("password").autocomplete = isLogin
        ? "current-password"
        : "new-password";

      $("submitButton").textContent = isLogin
        ? "Log In"
        : "Create Account";

      $("switchText").textContent = isLogin
        ? "Don't have an account?"
        : "Already have an account?";

      $("switchLink").textContent = isLogin
        ? "Create Account"
        : "Log In";
    }

    $("switchLink").addEventListener("click", (event) => {
      event.preventDefault();
      setMode(!isLogin);
    });

    $("authForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      const email = $("email").value.trim();
      const password = $("password").value;
      const button = $("submitButton");

      button.disabled = true;
      button.textContent = isLogin ? "Logging In..." : "Creating Account...";

      try {
        if (isLogin) {
          const { error } = await db.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          await checkSession();
        } else {
          const fullName = $("fullName").value.trim();
          const phone = $("phone").value.trim();

          if (!fullName || !phone) {
            throw new Error("Please enter your full name and phone number.");
          }

          const { data, error } = await db.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: fullName,
                phone: phone
              }
            }
          });

          if (error) throw error;

          if (data.session) {
            await checkSession();
          } else {
            showMessage(
              "Your registration was submitted. Please check your email to confirm your account before logging in.",
              "success"
            );
          }
        }
      } catch (error) {
        showMessage(error.message || "Something went wrong. Please try again.", "error");
      } finally {
        button.disabled = false;
        button.textContent = isLogin ? "Log In" : "Create Account";
      }
    });

    async function checkSession() {
      const { data, error } = await db.auth.getSession();

      if (error) throw error;

      const session = data.session;

      if (session) {
        $("authView").classList.add("hidden");
        $("dashboardView").classList.remove("hidden");
        $("accountEmail").textContent = "Email: " + session.user.email;
      } else {
        $("authView").classList.remove("hidden");
        $("dashboardView").classList.add("hidden");
      }
    }

    $("logoutButton").addEventListener("click", async () => {
      const { error } = await db.auth.signOut();

      if (error) {
        showMessage(error.message, "error");
        return;
      }

      $("authForm").reset();
      setMode(false);
      await checkSession();
    });

    checkSession();
  </script>
</body>
</html>
