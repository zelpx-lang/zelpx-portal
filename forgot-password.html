<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password | ZELPX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f5f2eb;color:#191919;font:16px Arial,sans-serif}
main{width:min(100%,560px);padding:34px 30px;background:#fffdfa;border:1px solid #e7e1d6;border-radius:24px;box-shadow:0 8px 30px #0000000a}
.brand{text-align:center;font-weight:800;letter-spacing:8px;font-size:32px;margin:0 0 34px}.brand span{color:#ff672d}
h1{text-align:center;font-size:28px;margin:0 0 12px}.muted{text-align:center;color:#77736c;line-height:1.5;margin-bottom:30px}
label{display:block;font-weight:700;letter-spacing:1px;margin:18px 0 9px}input{width:100%;padding:18px;border:2px solid #e6e1d8;border-radius:16px;font-size:18px}
button{width:100%;margin-top:24px;padding:18px;border:0;border-radius:40px;background:#ff672d;color:white;font-size:18px;font-weight:700}
button:disabled{opacity:.65}.message{display:none;margin-top:20px;padding:16px;border-radius:14px;line-height:1.45}.error{display:block;background:#fff0ed;color:#a13b2b}.success{display:block;background:#eef8ef;color:#246b37}
.back{display:block;text-align:center;margin-top:28px;color:#a84b24;font-weight:700}
</style></head>
<body><main>
<div class="brand">ZELPX<span> •</span></div>
<h1>Forgot password?</h1>
<p class="muted">Enter the email address you used when registering. We’ll send you a secure link to create a new password.</p>
<form id="forgotForm">
<label for="email">EMAIL ADDRESS</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
<button id="sendBtn" type="submit">Send reset link</button>
</form>
<div id="message" class="message" role="status" aria-live="polite"></div>
<a class="back" href="/customer">Back to Log In</a>
</main>
<script>
(() => {
const db=window.supabase.createClient("https://zsrnjkndgbchfxibxiyd.supabase.co","sb_publishable_prE7ENnFQaUGIq3h8U_uAQ_V9SjuBnb");
const form=document.getElementById("forgotForm"),email=document.getElementById("email"),btn=document.getElementById("sendBtn"),msg=document.getElementById("message");
const params=new URLSearchParams(location.search);if(params.get("email"))email.value=params.get("email");
form.addEventListener("submit",async e=>{
e.preventDefault();const address=email.value.trim();if(!address)return;
btn.disabled=true;btn.textContent="Sending…";msg.className="message";msg.textContent="";
try{const {error}=await db.auth.resetPasswordForEmail(address,{redirectTo:location.origin+"/recover.html"});if(error)throw error;
msg.textContent="If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder.";msg.className="message success";
}catch(err){msg.textContent=err.message||"Could not send the reset email. Please try again later.";msg.className="message error";}
finally{btn.disabled=false;btn.textContent="Send reset link";}
});
})();
</script></body></html>
