<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password | ZELPX</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6f8;color:#17202a;font:16px Arial,sans-serif}
    main{width:min(100%,440px);background:#fff;padding:30px;border-radius:16px;box-shadow:0 8px 30px #17202a12}
    h1{margin:0 0 8px;font-size:26px}.muted{color:#667085;line-height:1.5}label{display:block;margin:18px 0 7px;font-weight:600}
    input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#1769aa;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.message{margin-top:16px;padding:12px;border-radius:8px;line-height:1.45;display:none}.error{display:block;background:#fff0f0;color:#a11}.success{display:block;background:#edf9f0;color:#176b32}
    a{color:#1769aa}
  </style>
</head>
<body>
<main>
  <h1>Reset your password</h1>
  <p class="muted">Enter your new password below. Use at least 8 characters.</p>
  <form id="resetForm">
    <label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
    <button id="submitBtn" type="submit">Save new password</button>
  </form>
  <div id="message" class="message" role="status" aria-live="polite"></div>
  <p class="muted"><a href="/customer">Back to ZELPX sign in</a></p>
</main>
<script>
(() => {
  const SUPABASE_URL = "https://zsrnjkndgbchfxibxiyd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_prE7ENnFQaUGIq3h8U_uAQ_V9SjuBnb";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const form = document.getElementById("resetForm");
  const button = document.getElementById("submitBtn");
  const message = document.getElementById("message");
  const say = (text, type) => { message.textContent = text; message.className = "message " + type; };
  let recoveryReady = false;
  db.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session)) {
      recoveryReady = true;
      say("Recovery link verified. Choose a new password.", "success");
    }
  });
  db.auth.getSession().then(({data}) => {
    if (data.session) { recoveryReady = true; say("Recovery link verified. Choose a new password.", "success"); }
  });
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirmPassword").value;
    if (password.length < 8) return say("Password must contain at least 8 characters.", "error");
    if (password !== confirm) return say("Passwords do not match.", "error");
    button.disabled = true; button.textContent = "Saving…";
    try {
      const {data} = await db.auth.getSession();
      if (!recoveryReady && !data.session) throw new Error("This recovery link is invalid or expired. Request a new password reset email.");
      const {error} = await db.auth.updateUser({password});
      if (error) throw error;
      say("Password updated successfully. You can now sign in with your new password.", "success");
      form.reset();
    } catch (error) { say(error.message || "Could not update password. Request a new recovery email.", "error"); }
    finally { button.disabled = false; button.textContent = "Save new password"; }
  });
})();
</script>
</body>
</html>
