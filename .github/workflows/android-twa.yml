name: Build ZELPX Android TWA
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-twa.yml
permissions:
  contents: read
concurrency:
  group: zelpx-android-twa
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          # sdkmanager exits after accepting all licenses; yes then receives SIGPIPE.
          # Ignore the yes process' expected broken pipe and preserve sdkmanager's exit code.
          set +o pipefail
          yes | sdkmanager --licenses
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/android-keystore
          cp android/android-keystore android/android.keystore
          chmod 600 android/android-keystore android/android.keystore
          keytool -list -keystore android/android.keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -alias android >/dev/null
      - name: Initialize TWA project from production manifest
        shell: bash
        run: |
          # Use the JDK and Android SDK already installed by the workflow.
          # Bubblewrap defaults these prompts to installing a private SDK/JDK,
          # which then fails because its separate SDK licenses are not accepted.
          set +o pipefail
          # Bubblewrap asks for the existing JDK and Android SDK paths.
          # setup-java exports JAVA_HOME; setup-android exports ANDROID_HOME.
          { printf '%s\n%s\n' "$JAVA_HOME" "$ANDROID_HOME"; yes ''; } | bubblewrap init --manifest=https://app.zelpx.com/manifest.webmanifest --directory=android
      - name: Apply fixed ZELPX TWA settings
        working-directory: android
        run: |
          cp ../twa-manifest.json ./twa-manifest.json
          cp ./android.keystore ./android-keystore
          bubblewrap update --skipVersionUpgrade
      - name: Build signed APK and AAB
        working-directory: android
        run: yes '' | bubblewrap build
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zelpx-android-${{ github.run_number }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
