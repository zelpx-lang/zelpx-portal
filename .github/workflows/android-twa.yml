name: Build ZELPX Android TWA # rebuild after SDK path fix
on:
  workflow_dispatch:
  push:
    branches:
      - android/google-play-twa-current-main
permissions:
  contents: read
concurrency:
  group: zelpx-android-twa
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/android-keystore
          cp android/android-keystore android/android.keystore
          chmod 600 android/android-keystore android/android.keystore
          keytool -list -keystore android/android.keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -alias android >/dev/null
      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Configure Bubblewrap to use preinstalled Android tools
        shell: bash
        run: |
          mkdir -p "$HOME/.bubblewrap"
          # Bubblewrap expects sdkmanager at ANDROID_HOME/bin/sdkmanager.
          # GitHub's Android SDK ships it under cmdline-tools/<version>/bin.
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo 'Android sdkmanager was not found under cmdline-tools/<version>/bin'; find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print; exit 1; }
          mkdir -p "$ANDROID_HOME/bin"
          ln -sfn "$SDKMANAGER" "$ANDROID_HOME/bin/sdkmanager"
          chmod +x "$ANDROID_HOME/bin/sdkmanager"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          bubblewrap doctor
      - name: Prepare build manifest with available ZELPX icons
        shell: bash
        run: |
          curl -fsSL https://app.zelpx.com/manifest.webmanifest -o zelpx-build-manifest.json
          jq '(.icons[] | .src) |= (if endswith("192.svg") then "https://raw.githubusercontent.com/zelpx-lang/zelpx-portal/android/google-play-twa-current-main/icons/zelpx-192.svg" else "https://raw.githubusercontent.com/zelpx-lang/zelpx-portal/android/google-play-twa-current-main/icons/zelpx-512.svg" end) | (.shortcuts[]?.icons[]?.src) |= "https://raw.githubusercontent.com/zelpx-lang/zelpx-portal/android/google-play-twa-current-main/icons/zelpx-192.svg"' zelpx-build-manifest.json > zelpx-build-manifest.tmp
          mv zelpx-build-manifest.tmp zelpx-build-manifest.json
          cat zelpx-build-manifest.json
      - name: Initialize TWA project from production manifest
        shell: bash
        run: |
          bubblewrap init --manifest=https://raw.githubusercontent.com/zelpx-lang/zelpx-portal/android/google-play-twa-current-main/zelpx-build-manifest.json --directory=android
          test -f android/twa-manifest.json || { echo 'Bubblewrap did not create android/twa-manifest.json'; exit 1; }
      - name: Apply fixed ZELPX TWA settings
        working-directory: android
        run: |
          cp ../twa-manifest.json ./twa-manifest.json
          cp ./android.keystore ./android-keystore
          bubblewrap update --skipVersionUpgrade
      - name: Build signed APK and AAB
        working-directory: android
        run: yes '' | bubblewrap build
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zelpx-android-${{ github.run_number }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
