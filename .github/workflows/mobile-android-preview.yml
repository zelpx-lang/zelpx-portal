name: ZELPX Android Preview APK
run-name: ZELPX Android preview — ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-preview.yml"

permissions:
  contents: read

concurrency:
  group: zelpx-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-preview:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://zsrnjkndgbchfxibxiyd.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_prE7ENnFQaUGIq3h8U_uAQ_V9SjuBnb
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Add Firebase config when provided
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
            node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('google-services.json','utf8')); if (!j.project_info?.project_id) throw new Error('Firebase config is missing project_info.project_id'); const clients=j.client||[]; if (!clients.some(c => c.client_info?.android_client_info?.package_name === 'com.zelpx.app')) throw new Error('Firebase config does not contain Android package com.zelpx.app'); const p='app.json'; const a=JSON.parse(fs.readFileSync(p,'utf8')); a.expo.android.googleServicesFile='./google-services.json'; fs.writeFileSync(p, JSON.stringify(a,null,2)+'\\n');"
            echo "Firebase Android configuration decoded and validated for com.zelpx.app."
          else
            echo "Firebase config secret GOOGLE_SERVICES_JSON_BASE64 is empty. Building without remote FCM delivery."
          fi

      - name: TypeScript check
        run: npm run typecheck

      - name: Check Expo project
        run: npx expo-doctor
        continue-on-error: true

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zelpx-android-preview-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
